    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))

  text-decoration: none;
  text-underline-offset: 2px;

a:is(:hover, :focus-visible) {

  text-decoration-style: dashed;

h2,
h3,
h4,
h5,
h6,

b,

}

}

}

  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;

.card {

  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);

  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {

  top: 0;
  left: 0;

  pointer-events: none;

.viz-grid {

}

.btn,
.nav-link,

.form-select {
  font: inherit;
}

}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

#mv-demo{--mv-bg:light-dark(#f1f2ef,#101313);--mv-panel:light-dark(#ffffff,#191d1d);--mv-ink:light-dark(#1b2624,#e5eae5);--mv-muted:light-dark(#58645f,#99a69f);--mv-line:light-dark(#d5dcd6,#303b35);--mv-accent:#a8e879;color:var(--mv-ink);background:var(--mv-bg);font:14px/1.45 ui-sans-serif,system-ui,sans-serif;border-radius:12px;overflow:hidden}#mv-demo *{box-sizing:border-box}#mv-demo button{font:inherit;color:inherit;cursor:pointer}#mv-demo .mv-head{display:flex;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid var(--mv-line);flex-wrap:wrap}#mv-demo .mv-logo{display:flex;gap:9px;align-items:center;font-weight:500;letter-spacing:-.5px;font-size:20px}#mv-demo .mv-brand{color:var(--mv-muted);font-size:12px}#mv-demo .mv-tag{margin-left:auto;border:1px solid var(--mv-line);border-radius:5px;padding:4px 8px;color:var(--mv-muted);font:11px ui-monospace,monospace}#mv-demo .mv-toolbar{padding:17px 22px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}#mv-demo .mv-eyebrow{font:11px ui-monospace,monospace;letter-spacing:1.4px;color:var(--mv-muted);text-transform:uppercase}#mv-demo .mv-title{margin-top:4px;font-size:19px;letter-spacing:-.5px}#mv-demo .mv-action{background:var(--mv-panel);border:1px solid var(--mv-line);border-radius:6px;padding:9px 12px}#mv-demo .mv-action.primary{background:var(--mv-accent);color:#172012;border-color:transparent}#mv-demo .mv-stage{padding:14px 22px 25px;background-image:radial-gradient(var(--mv-line) .7px,transparent .7px);background-size:18px 18px}#mv-demo .mv-origin{width:250px;margin:auto}#mv-demo .mv-tile{display:block;width:100%;padding:0;text-align:left;background:var(--mv-panel);border:1px solid var(--mv-line);border-radius:8px;overflow:hidden;transition:transform .15s}#mv-demo .mv-tile:hover{transform:translateY(-3px)}#mv-demo .mv-tile.winner{border:2px solid var(--mv-accent)}#mv-demo .mv-tile-top{display:flex;justify-content:space-between;gap:6px;padding:9px 10px;font:11px ui-monospace,monospace}#mv-demo .mv-status{color:var(--mv-muted)}#mv-demo canvas{display:block;width:100%;aspect-ratio:16/10;image-rendering:pixelated;background:#201d1b}#mv-demo .mv-tile-bottom{padding:10px}#mv-demo .mv-name{font-weight:500}#mv-demo .mv-meta{display:flex;justify-content:space-between;margin-top:5px;color:var(--mv-muted);font:11px ui-monospace,monospace}#mv-demo .mv-junction{text-align:center;padding:17px 0;position:relative}#mv-demo .mv-junction:before{content:&#x27;&#x27;;height:17px;width:1px;background:var(--mv-line);position:absolute;top:0;left:50%}#mv-demo .mv-junction span{display:inline-block;margin-top:9px;padding:6px 12px;border-radius:20px;background:var(--mv-panel);border:1px solid var(--mv-line);font:12px ui-monospace,monospace}#mv-demo .mv-branches{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;position:relative;padding-top:20px}#mv-demo .mv-branches:before{content:&#x27;&#x27;;position:absolute;top:0;left:12%;right:12%;height:1px;background:var(--mv-line)}#mv-demo .mv-branch{position:relative}#mv-demo .mv-branch:before{content:&#x27;&#x27;;position:absolute;top:-20px;left:50%;height:20px;width:1px;background:var(--mv-line)}#mv-demo .mv-odds{height:3px;background:var(--mv-line);margin-top:9px}#mv-demo .mv-odds div{height:100%;background:var(--mv-accent)}#mv-demo .mv-foot{border-top:1px solid var(--mv-line);padding:13px 22px;display:flex;gap:18px;justify-content:space-between;color:var(--mv-muted);font:11px ui-monospace,monospace;flex-wrap:wrap}#mv-demo .mv-notice{padding-top:20px;display:flex;justify-content:center;gap:8px;align-items:center;color:var(--mv-muted);font-size:12px}#mv-demo .mv-focus{padding:0 22px 24px}#mv-demo .mv-focus-grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(180px,1fr);gap:20px}#mv-demo .mv-focus-screen{border-radius:8px;overflow:hidden;border:1px solid var(--mv-line)}#mv-demo .mv-side{background:var(--mv-panel);border:1px solid var(--mv-line);border-radius:8px;padding:16px}#mv-demo .mv-side h3{font-size:15px;font-weight:500;margin:5px 0 20px}#mv-demo .mv-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--mv-line);font-size:12px}#mv-demo .mv-siblings{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}#mv-demo .mv-sibling{border:1px solid var(--mv-line);border-radius:5px;padding:9px;background:var(--mv-panel);font-size:12px}#mv-demo [hidden]{display:none!important}@media(max-width:650px){#mv-demo .mv-branches{grid-template-columns:repeat(2,minmax(0,1fr));gap:25px 12px}#mv-demo .mv-focus-grid{grid-template-columns:1fr}#mv-demo .mv-siblings{grid-template-columns:repeat(2,1fr)}#mv-demo .mv-head,#mv-demo .mv-toolbar{padding:14px}#mv-demo .mv-stage{padding:12px 14px 20px}#mv-demo .mv-tag{margin-left:0}#mv-demo .mv-origin{width:220px}}

#mv-demo{color-scheme:dark;--mv-bg:#060608;--mv-panel:#0a0a0e;--mv-ink:#f5f3f8;--mv-muted:#a3a3ad;--mv-line:#ffffff21;--mv-accent:#c084fc;font-family:&#x27;MvPixelSquare&#x27;,ui-monospace,monospace;font-weight:500;min-height:740px;border:1px dashed var(--mv-line);background:#060608}#mv-demo .mv-head{border-bottom:1px dashed var(--mv-line);padding:18px 28px}#mv-demo .mv-logo{font-family:&#x27;MvPixelSquare&#x27;,monospace;font-size:23px;letter-spacing:-.7px}#mv-demo .mv-brand{font-family:&#x27;MvPixelSquare&#x27;,monospace;font-size:13px;color:#92909a;border-left:1px dashed #ffffff26;padding-left:16px}#mv-demo .mv-tag{border:none;font-family:&#x27;MvPixelSquare&#x27;,monospace;font-size:12px;color:#87838f;padding:0}#mv-demo .mv-toolbar{padding:32px 28px 26px;gap:20px;align-items:center}#mv-demo .mv-eyebrow{font-family:&#x27;MvPixelSquare&#x27;,monospace;text-transform:lowercase;color:#b392d2;letter-spacing:.3px;font-size:13px}#mv-demo .mv-title{font-family:&#x27;MvPixelCircle&#x27;,monospace;font-weight:500;font-size:clamp(29px,4vw,48px);line-height:1.12;letter-spacing:-1.6px;margin:10px 0 12px;color:#e9d5ff}#mv-demo .mv-subtitle{font-family:&#x27;MvPixelSquare&#x27;,monospace;font-size:15px;color:#a3a3ad}#mv-demo .mv-action{border-radius:2px;border:1px dashed #c084fc80;padding:11px 16px;font-family:&#x27;MvPixelSquare&#x27;,monospace;text-transform:lowercase}#mv-demo .mv-action.primary{background:#9333ea;border:1px dashed #c084fc;color:#fff}#mv-demo .mv-action:hover{background:#7c3aed}#mv-demo .mv-stage{padding:0 28px 28px;column-gap:24px}#mv-demo .mv-main-tile{border:1px dashed #ffffff30;border-radius:2px;background:#0a0a0e}#mv-demo .mv-main-tile .mv-tile-top{background:#0c0b10;border-bottom:1px dashed #ffffff21;padding:12px 14px;font-family:&#x27;MvPixelSquare&#x27;,monospace;text-transform:lowercase;font-size:13px}#mv-demo .mv-main-tile .mv-status{color:#c084fc}#mv-demo .mv-main-tile canvas{border-radius:0}#mv-demo .mv-main-tile .mv-tile-bottom{padding:18px 16px}#mv-demo .mv-main-tile .mv-name{font-family:&#x27;MvPixelSquare&#x27;,monospace;font-size:22px}#mv-demo .mv-meta{font-family:&#x27;MvPixelSquare&#x27;,monospace!important}#mv-demo .mv-branches{gap:14px}#mv-demo .mv-branches .mv-tile{border:1px dashed #ffffff28;border-radius:2px;background:#09090d}#mv-demo .mv-branches .mv-tile:hover{transform:none;border-color:#c084fc80;background:#100c16}#mv-demo .mv-branches .mv-tile-top{font-family:&#x27;MvPixelSquare&#x27;,monospace;text-transform:lowercase;font-size:12px;padding:8px 10px}#mv-demo .mv-branches .mv-meta{font-size:12px}#mv-demo .mv-branches .mv-name{font-size:14px}#mv-demo .mv-branches .mv-tile-bottom{padding:9px 10px}#mv-demo .mv-watching{outline:none;border-color:#c084fc!important;background:#130d1c!important}#mv-demo .mv-watching .mv-name{color:#d8b4fe}#mv-demo .mv-tile.winner{border:1px solid #c084fc;background:#160d22}#mv-demo .mv-odds{height:2px;background:#26202e}#mv-demo .mv-junction span{font-family:&#x27;MvPixelSquare&#x27;,monospace;font-size:13px;color:#b9a6ca}#mv-demo .mv-notice{border-top:1px dashed #ffffff21;font-family:&#x27;MvPixelSquare&#x27;,monospace;color:#9993a1;font-size:13px}#mv-demo .mv-foot{font-family:&#x27;MvPixelSquare&#x27;,monospace;border-top:1px dashed #ffffff21;font-size:12px;padding:17px 28px;color:#8d8895}#mv-demo button:focus-visible{outline:2px solid #e9d5ff;outline-offset:4px}@media(max-width:720px){#mv-demo .mv-head{padding:16px}#mv-demo .mv-toolbar{padding:24px 16px}#mv-demo .mv-stage{padding:0 16px 24px}#mv-demo .mv-title{font-size:33px;letter-spacing:-1px}#mv-demo .mv-branches .mv-meta{font-size:11px}#mv-demo .mv-branches .mv-tile-top{font-size:11px;padding:8px}#mv-demo .mv-brand{border:none;padding-left:0}#mv-demo .mv-head{gap:9px 16px}#mv-demo .mv-logo{font-size:21px}#mv-demo .mv-foot{padding:16px}}

@media(min-width:721px){
#mv-demo{height:100dvh;min-height:0;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto}
#mv-demo .mv-head{padding:12px 22px}
#mv-demo .mv-toolbar{padding:17px 22px 18px;flex-wrap:nowrap}
#mv-demo .mv-title{font-size:36px;margin:5px 0 6px}
#mv-demo .mv-subtitle{font-size:13px}
#mv-demo .mv-action{flex-shrink:0}
#mv-demo .mv-stage{min-height:0;grid-template-columns:minmax(0,3fr) minmax(260px,1fr);grid-template-rows:24px minmax(0,1fr) 28px;padding:0 22px 12px;gap:0 20px}
#mv-demo .mv-origin{height:100%;min-height:0;grid-row:1 / 3;align-self:stretch}
#mv-demo .mv-main-tile{height:100%;min-height:0;display:grid;grid-template-rows:34px minmax(0,1fr) 68px}
#mv-demo .mv-main-tile .mv-tile-top{padding:8px 12px;align-items:center}
#mv-demo .mv-main-tile canvas{height:100%;width:100%;min-height:0;aspect-ratio:auto;object-fit:contain;background:#030304}
#mv-demo .mv-main-tile .mv-tile-bottom{padding:9px 12px}
#mv-demo .mv-main-tile .mv-name{font-size:18px}
#mv-demo .mv-main-tile .mv-meta{margin-top:4px}
#mv-demo .mv-junction{padding:0;min-height:0}
#mv-demo .mv-junction span{font-size:12px}
#mv-demo .mv-branches{height:100%;min-height:0;display:grid;grid-template-columns:1fr;grid-template-rows:repeat(4,minmax(0,1fr));gap:9px}
#mv-demo .mv-branch{height:100%;min-height:0}
#mv-demo .mv-branches .mv-tile{height:100%;min-height:0;grid-template-rows:25px minmax(0,1fr);grid-template-columns:43% minmax(0,1fr)}
#mv-demo .mv-branches .mv-tile-top{padding:4px 8px;font-size:11px;align-items:center}
#mv-demo .mv-branches canvas{min-height:0;height:100%;width:100%;aspect-ratio:auto;object-fit:contain;background:#030304}
#mv-demo .mv-branches .mv-tile-bottom{padding:5px 8px;min-height:0}
#mv-demo .mv-branches .mv-name{font-size:13px}
#mv-demo .mv-branches .mv-meta{font-size:11px;margin-top:3px;gap:1px}
#mv-demo .mv-odds{margin-top:5px}
#mv-demo .mv-notice{margin-top:5px;padding-top:5px;font-size:11px;min-height:0}
#mv-demo .mv-foot{padding:8px 22px;font-size:11px;gap:8px}
}
@media(min-width:721px) and (max-height:720px){
#mv-demo .mv-head{padding:8px 18px}
#mv-demo .mv-toolbar{padding:10px 18px}

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
&lt;/script&gt;
